<title>The Money Tree Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one phone-width column. Home lists one coin per level; a level lists its power-ups; a power-up is one screen: why, steps, proof, done button. */
  :root {
    color-scheme: dark;
    --bg: #0e2a20;
    --surface: #153a2c;
    --surface-2: #1b4636;
    --line: #25523f;
    --fg: #eaf4ec;
    --muted: #9fbfaa;
    --gold: #f6c744;
    --gold-ink: #2a2105;
    --ok: #7fd49a;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 40px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .wrap { max-width: 30rem; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.9rem, 8vw, 2.6rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 10px;
  }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .logo { font-size: 3.4rem; line-height: 1; letter-spacing: 0.04em; }
  .home-title { font-size: clamp(2.3rem, 11vw, 3.2rem); margin-top: 10px; }

  .back {
    background: none; border: 0; padding: 8px 0; min-height: 44px;
    color: var(--muted); font-weight: 600; align-self: flex-start;
  }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .row {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; min-height: 64px; min-width: 0;
  }
  .row.done { border-color: var(--gold); }
  .row.done .end { color: var(--gold); font-weight: 600; }
  .row[disabled] { opacity: 0.55; cursor: default; }
  .row .ico { font-size: 1.6rem; line-height: 1; width: 2rem; text-align: center; flex: none; }
  .row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .row .name { font-weight: 600; line-height: 1.3; }
  .row .sub { color: var(--muted); font-size: 0.88rem; line-height: 1.3; margin-top: 2px; }
  .row .end { color: var(--muted); font-size: 0.9rem; flex: none; }
  .tick {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; flex: none; font-size: 0.95rem; color: var(--gold-ink);
  }
  .tick.on { background: none; border-color: transparent; font-size: 1.35rem; display: flex; align-items: center; justify-content: center; line-height: 1; }

  .level-head { display: flex; align-items: center; gap: 16px; }
  .level-head .big { font-size: 3.2rem; line-height: 1; }
  .kicker { color: var(--gold); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
  .bar { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--gold); border-radius: 99px; }

  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 0.9rem; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 2px 12px; color: var(--fg); font-weight: 600; font-size: 0.85rem; }
  .why { font-size: 1.05rem; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  }
  .step input { width: 24px; height: 24px; flex: none; margin: 2px 0 0; accent-color: var(--gold); }
  .step .t { display: block; min-width: 0; overflow-wrap: anywhere; }
  .step .note { display: block; color: var(--muted); margin-top: 6px; white-space: pre-line; overflow-wrap: anywhere; }
  .step input:checked + .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .t.plain { flex: 1; }
  .t.plain .actions .btn { width: 100%; }
  .t.plain .msg:empty { display: none; }
  /* Backup steps hold a button or a box: strike through the words only. */
  .step input:checked + .t.plain { text-decoration: none; color: inherit; }
  .step input:checked + .t.plain .lbl { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .shot { display: block; width: 100%; max-width: 360px; border-radius: 14px; border: 1px solid var(--line); }
  .already { margin: -4px 0 10px; }
  .already .link { padding: 0; min-height: 0; }
  .how { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
  .how span { display: inline-block; width: 1.8em; }
  .done-when { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; border-left: 4px solid var(--gold); }
  .done-when .kicker { display: block; margin-bottom: 2px; }

  .btn {
    width: 100%; min-height: 56px; border: 0; border-radius: 16px; font-weight: 700; font-size: 1.1rem;
    background: var(--gold); color: var(--gold-ink); padding: 14px 18px;
  }
  .btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .collected { text-align: center; color: var(--ok); font-weight: 700; padding: 14px; background: var(--surface); border-radius: 16px; }
  .link.armed { color: var(--gold); font-weight: 700; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 10px 0; min-height: 44px; align-self: center; }

  .reward { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 24px; }
  .grow { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .grow .plant { font-size: 6rem; line-height: 1; }
  .reward .btn { max-width: 24rem; }

  .field { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .field label { font-weight: 600; }
  .field .hint { color: var(--muted); font-size: 0.88rem; }
  .field input, .box {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; min-height: 48px; width: 100%;
  }
  .field input { display: block; box-sizing: border-box; min-width: 0; max-width: 100%; }
  .field input[type=date] { text-align: left; width: 100%; max-width: 220px; -webkit-appearance: none; appearance: none; }
  .fields { display: flex; flex-direction: column; gap: 12px; }
  .box { min-height: 120px; resize: vertical; font-size: 0.95rem; }
  .msg { color: var(--gold); font-weight: 600; min-height: 1.5em; }
  .stats { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; gap: 12px; }
  .stat b { color: var(--gold); }
  button.stat { font: inherit; color: inherit; width: 100%; text-align: left; cursor: pointer; }
  .tiplink { display: block; padding: 6px 0 0; min-height: 0; text-align: left; }
  .donuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .donut { font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
  .donut svg { width: 100%; max-width: 104px; height: auto; }
  .donut .track { fill: none; stroke: var(--surface-2); stroke-width: 12; }
  .donut .arc { fill: none; stroke: var(--gold); stroke-width: 12; stroke-linecap: butt; }
  .donut text { fill: var(--fg); font-size: 18px; font-weight: 700; font-family: var(--display); }
  .donut b { font-size: 0.85rem; line-height: 1.2; margin-top: 4px; }
  .donut span { color: var(--muted); font-size: 0.8rem; }
  .proto { color: var(--muted); font-size: 0.85rem; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }

  @media (prefers-reduced-motion: no-preference) {
    .grow .plant { animation: pop 0.7s ease-out both; }
  }
  @keyframes pop {
    0% { transform: scale(0.6); }
    60% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
</style>

  function levelOpen(n) {

  const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const x = new Date(y, m - 1, d + n); return x.getFullYear() + "-" + pad(x.getMonth() + 1) + "-" + pad(x.getDate()); };
  // Why a card can't be started yet, or null. Needs come from the sheet; a wait counts from the last need done.

  const pad = (n) => String(n).padStart(2, "0");
  function thisMonday() {

    show(
      '<button class="back" data-act="home">← Home screen</button>' +
      '<div class="level-head"><span class="big">' + stage(n) + '</span><div><span class="kicker">Level ' + n + '</span><h1>' + esc(l.name) + '</h1></div></div>' +
      '<div><div class="bar" role="img" aria-label="' + d + ' of ' + l.total + ' power-ups collected"><span style="width:' + Math.round((d / l.total) * 100) + '%"></span></div>' +
      '<p class="muted" style="margin-top:8px">' + d + ' of ' + l.total + ' power-ups collected 💦</p></div>' +
      '<section><h2>Choose a power-up</h2><ul class="list">' + rows + '</ul></section>'
    );
  }

  function cardView(id) {
    const c = CARDS.find((x) => x.id === id), l = level(c.level);
    const done = !!store.done[id], ticks = store.ticks[id] || [];
    editing = null;
    const form = c.form === "numbers" && !done && !weekKeys().length;
    const steps = parseSteps(c.steps).filter((s) => s.t.trim()).map((s, i) =>
      '<label class="step"><input type="checkbox" data-act="tick" data-id="' + id + '" data-i="' + i + '"' + (ticks.includes(i) ? " checked" : "") + '>' +
      '<span class="t">' + esc(s.t) + (s.notes.length ? '<span class="note">' + esc(s.notes.join("\n")) + '</span>' : "") + '</span></label>'
    ).join("");
    show(
      '<button class="back" data-act="level" data-n="' + c.level + '">← ' + esc(l.name) + '</button>' +
      '<div class="meta"><span class="kicker">Power-up ' + c.order + ' of ' + l.total + '</span><span class="chip">' + esc(c.time) + '</span></div>' +
      '<h1>' + esc(c.name) + '</h1>' +
      '<section><h2>Why it matters</h2><p class="why">' + esc(c.why) + '</p></section>' +
      (steps ? '<section><h2>Steps</h2>' +
        // Cards she may have done before: a shortcut down to the button. Not on the numbers card or the cards that wait for weeks of numbers.
        (!done && !c.form && !c.wait ? '<p class="muted already">Already done this? <button class="link" data-act="jump">Tap here</button></p>' : "") +
        '<div class="steps">' + steps + '</div></section>' : "") +
      (c.image ? '<section><h2>What you\'ll see</h2><img class="shot" src="' + c.image + '" alt="Instagram search bar with suggestions listed underneath"></section>' : "") +
      (form ? '<section><h2>Your numbers</h2><p class="muted">Numbers from the last 7 days. Each box tells you where to find the number. No number? Type 0.</p><div class="fields"><div class="field"><label for="wk">Week starting (a Monday)</label><input id="wk" type="date" value="' + thisMonday() + '"></div>' + numberFields([]) + '</div>' + '<p class="msg" id="msg" role="status"></p></section>' : "") +
      (c.copy ? '<section><h2>Copy this</h2><textarea class="box" id="cp" readonly rows="3">' + esc(c.copy) + '</textarea>' +
        '<div class="actions" style="margin-top:10px"><button class="btn ghost" data-act="copycard" data-id="' + id + '">' + esc(c.copyLabel) + '</button></div><p class="msg" id="msg" role="status"></p></section>' : "") +
      '<div class="done-when"><span class="kicker">You\'re done when</span>' + esc(c.doneWhen) + '</div>' +
      '<div class="actions">' + (done
        ? '<div class="collected">💦 Power-up collected</div><button class="link" data-act="undo" data-id="' + id + '">Undo</button>'
        : form ? '<button class="btn" data-act="savecard" data-id="' + id + '">Save my numbers</button>' : '<button class="btn" id="did" data-act="did" data-id="' + id + '">I did it ✓</button>') + '</div>'
    );
    const cp = document.getElementById("cp");
    if (cp) cp.style.height = cp.scrollHeight + 4 + "px"; // show the whole text, however it wraps
  }

  // The six number boxes, shared by the Track your Instagram numbers screen and the first-numbers card.
  function numberFields(w) {
    const F = [
      ["Views", "Instagram, your profile, Professional dashboard, Insights, Views. Pick Last 7 days at the top, then tap Update. Can't find it? Leave it blank."],
      ["Bio link clicks", "Instagram, your profile, Professional dashboard, Insights. Pick 7 days at the top left, tap Update, then look under Profile activity for External link taps (or Link taps)."],
      ["Story link clicks", "Open each story with a link sticker, swipe up, and add up the Link sticker taps."],
      ["Calls", "Calendly, Meetings, Past. Count the calls you held in the last 7 days, not no-shows."],
      ["New clients", "Stripe, Payments. New clients in the last 7 days."],
      ["DM replies", "Count the mums who messaged you about coaching in the last 7 days, including replies to your stories and to messages you sent. Count each mum once."]
    ].map((f, i) => [f, i]);
    const order = [0, 1, 2, 5, 3, 4];
    return order.map((i) => { const f = F[i][0];
      return '<div class="field"><label for="n' + i + '">' + f[0] + '</label><span class="hint">' + esc(f[1]) + '</span>' +
      '<input id="n' + i + '" type="number" inputmode="numeric" min="0" step="1" value="' + (w[i] === undefined || w[i] === null ? "" : w[i]) + '"></div>'; }
    ).join("");
  }

  function checkin(iso, msg) {
    iso = iso || thisMonday();
    const w = store.weeks[iso] || [];
    editing = store.weeks[iso] ? iso : null;
    const G = numberFields(w);
    show(
      (editing ? '<button class="back" data-act="dash" data-wk="' + iso + '">← Dashboard</button>' : '<button class="back" data-act="home">← Home screen</button>') +
      '<h1>' + (editing ? "Edit this week" : "Track your Instagram numbers") + '</h1>' +
      '<p class="muted">Numbers from the last 7 days. If you had none, type 0.</p>' +
      '<div class="field"><label for="wk">Week starting (a Monday)</label><input id="wk" type="date" value="' + iso + '"></div>' + G +
      '<p class="msg" id="msg" role="status">' + esc(msg || "") + '</p>' +
      '<div class="actions"><button class="btn" data-act="saveweek">' + (editing ? "Save changes" : "Save my numbers") + '</button></div>' +
      '<p class="proto">Prototype: where to find each number has not been checked on a phone yet.</p>'
    );
  }

  const short = (iso) => { const [, m, d] = iso.split("-").map(Number); return d + " " + MON[m - 1]; };
  const ratio = (a, b) => (b > 0 ? (a / b) * 100 : null);
  // One donut per percentage for the chosen week: the arc fills to the % (out of 100).
  function donut(k, wk, label, from, a, b) {
    const v = ratio(a, b), C = 2 * Math.PI * 40, arc = v === null ? 0 : Math.max(0, Math.min(100, v)) / 100 * C;
    const txt = v === null ? "–" : num(v) + "%";
    return '<button class="donut" data-act="insight" data-k="' + k + '" data-wk="' + wk + '"><svg viewBox="0 0 100 100" role="img" aria-label="' + esc(label) + ': ' + txt + '">' +
      '<circle cx="50" cy="50" r="40" class="track"/>' +
      '<circle cx="50" cy="50" r="40" class="arc" stroke-dasharray="' + arc.toFixed(1) + " " + C.toFixed(1) + '" transform="rotate(-90 50 50)"/>' +
      '<text x="50" y="56" text-anchor="middle">' + txt + '</text></svg>' +
      '<b>' + esc(label) + '</b><span>' + esc(from) + '</span></button>';
  }

  function dashboard(iso, saved) {
    const ks = weekKeys(), w = store.weeks[iso], prev = ks[ks.indexOf(iso) - 1];
    let delta = "";
    if (prev) {
      const d = clicks(w) - clicks(store.weeks[prev]);
      delta = d > 0 ? "Clicks up " + d + " on the week before." : d < 0 ? "Clicks down " + (-d) + " on the week before. That's normal. Keep going." : "Clicks the same as the week before.";
    } else delta = "This is your first week.";
    const calls = w[3], sales = w[4], t = clicks(w), v = w[0];
    show(
      '<button class="back" data-act="home">← Home screen</button>' +
      '<h1>' + (saved ? "Week saved" : "Dashboard") + '</h1>' +
      '<p class="muted">Week of ' + esc(fmt(iso)) + '. ' + esc(delta) + '</p>' +
      // After a weekly save: Safari can clear a site's data after 7 days unused, so remind her to back up.
      (saved ? '<p class="muted already">Tip: <button class="link" data-act="backup">back up your numbers</button> now and then, in case Safari clears them.</p>' : "") +
      '<div class="stats">' +
      '<button class="stat" data-act="insight" data-k="3" data-wk="' + iso + '"><span>Views <span class="muted">· tips</span></span><b>' + (v === null ? "–" : v) + '</b></button>' +
      '<div class="stat"><span>Clicks</span><b>' + t + '</b></div>' +
      '<div class="stat"><span>Calls</span><b>' + calls + '</b></div>' +
      '<div class="stat"><span>New clients</span><b>' + sales + '</b></div>' +
      '</div>' +
      '<p class="muted" style="font-size:0.88rem">Clicks = bio link clicks + story link clicks + DM replies.</p>' +
      '<section><h2>This week in percentages</h2><p class="muted" style="margin-bottom:10px">Tap a % for tips on improving your numbers.</p><div class="donuts">' +
      donut(0, iso, "Views to clicks", v === null ? "Add views" : t + " of " + v, t, v) +
      donut(1, iso, "Clicks to calls", calls + " of " + t, calls, t) +
      donut(2, iso, "Calls to clients", sales + " of " + calls, sales, calls) + '</div></section>' +
      '<div class="actions"><button class="btn ghost" data-act="editweek" data-wk="' + iso + '">Edit this week\'s numbers</button></div>' +
      (ks.length > 1 ? '<section><h2>Other weeks</h2><div class="actions">' + ks.slice(-8).reverse().map((k) => '<button class="btn ghost" data-act="dash" data-wk="' + k + '">Week of ' + esc(fmt(k)) + '</button>').join("") + '</div></section>' : "") +
      '<div class="actions"><button class="btn" data-act="backup">Back up my numbers</button>' +
      '<p class="muted" style="text-align:center">Your numbers live on this phone only. A backup keeps them safe.</p>' +
      '<button class="link" data-act="delweek" data-wk="' + iso + '">' + (delArmed === iso ? "Tap again to delete this week" : "Delete this week") + '</button></div>'
    );
  }

  // Plain, general ideas (no benchmarks): they come from the plan in docs/instagram-plan/01 and the power-ups.
  // Tips that a card covers point to it ("card"), so she can reopen the full steps. Views (k 3) has no circle: she taps the Views number.
  const INSIGHTS = [
    { name: "Views to clicks", means: "Out of everyone who saw your posts and stories, how many clicked your link or messaged you.",
      tips: [{ t: "End every post with one call to action.", card: "c3" }, { t: "Add a Get started link sticker to a story 2 to 3 times a week.", card: "c5" }, { t: "Add a Questions sticker to a story, then message the mums who answer.", card: "c6" }, { t: "Keep showing client results.", card: "c4" }] },
    { name: "Clicks to calls", means: "Out of the people who clicked your link or messaged you, how many booked a call.",
      tips: [{ t: "Reply to DMs within a few hours.", card: "c6" }, { t: "Send the link once she's interested, with one line on what to click.", card: "c6" }] },
    { name: "Calls to clients", means: "Out of the calls you held, how many became clients.",
      tips: [{ t: "After each call, write one line on what she was unsure about." }, { t: "Answer the worry that comes up most early in the call." }, { t: "Follow up the same day with the payment link." }] },
    { name: "Views", means: "How many times your posts and stories were seen, by followers and mums who don't follow you yet.",
      tips: [{ t: "Make another reel like your best one.", card: "c9" }, { t: "Invite another client to a collab.", card: "c7" }, { t: "Use a search phrase in your next caption.", card: "c8" }] }
  ];
  // A tip links only to a card she can open now; otherwise the tip shows on its own, so tips never skip her ahead.
  function tipLink(id) {
    const c = CARDS.find((x) => x.id === id);
    if (!c) return "";
    if (!store.done[c.id] && (!levelOpen(c.level) || cardLock(c))) return "";
    return '<button class="link tiplink" data-act="card" data-id="' + c.id + '">' + esc(c.name) + '</button>';
  }
  function insightView(k, iso) {
    const ks = weekKeys(), w = store.weeks[iso], prev = ks[ks.indexOf(iso) - 1];
    const f = [(x) => ratio(clicks(x), x[0]), (x) => ratio(x[3], clicks(x)), (x) => ratio(x[4], x[3]), (x) => x[0]][k];
    const cur = f(w), before = prev ? f(store.weeks[prev]) : null, I = INSIGHTS[k];
    const unit = k === 3 ? "" : "%", pts = k === 3 ? "" : " points";
    let line = cur === null ? (k === 0 || k === 3 ? "Add your views for this week to see this number." : "There's nothing to measure this week yet.") : "This week: " + num(cur) + unit + (k === 3 ? " views." : ".");
    if (cur !== null && before !== null) {
      const d = Math.round((cur - before) * 10) / 10;
      line += d > 0 ? " Up " + d + pts + " on the week before." : d < 0 ? " Down " + (-d) + pts + " on the week before." : " The same as the week before.";
    }
    show(
      '<button class="back" data-act="dash" data-wk="' + iso + '">← Dashboard</button>' +
      '<h1>' + esc(I.name) + '</h1><p class="muted">Week of ' + esc(fmt(iso)) + '</p>' +
      '<div class="done-when"><span class="kicker">Your number</span>' + esc(line) + '</div>' +
      '<section><h2>What it tells you</h2><p class="why">' + esc(I.means) + '</p></section>' +
      '<section><h2>Tips</h2><div class="steps">' + I.tips.map((t) => '<div class="step"><span class="t">' + esc(t.t) + (t.card ? tipLink(t.card) : "") + '</span></div>').join("") + '</div></section>' +
      '<p class="proto">General tips, not targets. One week is a small sample, so look for a pattern over 3 to 4 weeks before changing much.</p>' +
      '<div class="actions"><button class="btn ghost" data-act="dash" data-wk="' + iso + '">Back to dashboard</button></div>'
    );
  }

  function backupView(msg) {
    const has = weekKeys().length > 0 || Object.keys(store.done).length > 0;
    // Laid out like a card: why, then tickable steps. Ticks here are not saved (each backup starts fresh).
    const step = (text, extra, note) => '<div class="step"><input type="checkbox" aria-label="Done"><div class="t plain">' + (text ? '<span class="lbl">' + text + '</span>' : "") + (note ? '<span class="note">' + note + '</span>' : "") + (extra || "") + '</div></div>';
    show(
      '<button class="back" data-act="home">← Home screen</button>' +
      '<h1>Back up or restore</h1>' +
      '<section><h2>Why it matters</h2><p class="why">Your game is only saved on this device. If Safari clears it or you get a new phone, your power-ups and numbers are gone. A copy in your Notes lets you get them back.</p></section>' +
      (has
        ? '<section><h2>Back up</h2><div class="steps">' +
          step("", '<div class="actions"><button class="btn" data-act="copy">Copy my backup</button></div><p class="msg" id="bkmsg" role="status"></p>') +
          step('Open Notes and paste it into a note called Money Tree backup.', "", 'Next time, use the same note: just replace what\'s there with the new copy. Do it every few weeks.') +
          '</div><p class="muted" style="margin:14px 0 8px">What gets copied:</p><textarea class="box" id="bk" readonly>' + esc(backupText()) + '</textarea></section>'
        : '<section><h2>Back up</h2><p class="muted">Nothing to back up yet. Collect your first power-up first.</p></section>') +
      '<section><h2>Restore</h2><p class="muted" style="margin-bottom:10px">Only if you\'ve lost your progress.</p><div class="steps">' +
      step('Open your Money Tree backup note and copy everything in it.') +
      step('Paste it here.', '<textarea class="box" id="rs" style="margin-top:10px" placeholder="Money Tree backup&#10;Power-up 1: 20 Oct 2026&#10;26 Oct 2026: 120, 5, 2, 3, 1, 0"></textarea>') +
      step("", '<div class="actions"><button class="btn ghost" data-act="restore">Restore</button></div><p class="msg" id="msg" role="status">' + esc(msg || "") + '</p>') +
      '</div></section>'
    );
  }

  function reward(id) {
    const c = CARDS.find((x) => x.id === id), n = c.level, l = level(n);
    const d = doneCount(n), complete = levelComplete(n);
    const next = cardsOf(n).find((x) => !store.done[x.id] && !cardLock(x));
    const waiting = cardsOf(n).find((x) => !store.done[x.id] && cardLock(x));
    const nextLevel = LEVELS.find((L) => L.n > n && levelOpen(L.n) && !levelComplete(L.n));
    const line = complete
      ? "You've turned your coin into a money tree 🙌🏽"
      : d + " of " + l.total + " power-ups collected! Your coin is now a 🌱";
    let buttons;
    if (complete) buttons = '<button class="btn" data-act="home">Back to the home screen</button>';
    else if (next) buttons = '<button class="btn" data-act="card" data-id="' + next.id + '">Next: ' + esc(next.name) + '</button>' +
      '<button class="btn ghost" data-act="level" data-n="' + n + '">Back to ' + esc(l.name) + '</button>';
    else buttons = (waiting ? '<p class="muted" style="text-align:center">' + esc(waiting.name) + ': ' + esc(cardLock(waiting)) + '</p>' : "") +
      (nextLevel ? '<button class="btn" data-act="level" data-n="' + nextLevel.n + '">Meanwhile: ' + esc(nextLevel.name) + '</button>' : "") +
      '<button class="btn ghost" data-act="home">Back to the home screen</button>';
    show(
      '<div class="reward"><div class="grow"><span class="plant">' + stage(n) + '</span></div>' +
      '<h1>' + (complete ? "Level completed!" : "Power-up collected") + '</h1><p class="muted">' + esc(line) + '</p>' +
      '<div class="actions" style="width:100%;align-items:center">' + buttons + '</div></div>'
    );
  }

  function setMsg(m) { const el = document.getElementById("msg"); if (el) el.textContent = m; }
  function copyBackup() {
    // Success shows on the button itself; only the fallback needs words, shown right under it.
    const say = (m) => { const el = document.getElementById("bkmsg"); if (el) el.textContent = m; };
    const manual = () => { selectBackup(); say("Press and hold the text, tap Select All, then Copy."); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(backupText()).then(() => { const btn = document.querySelector('[data-act="copy"]'); btn.textContent = "Copied"; say(""); btn.closest(".step").querySelector("input").checked = true; }, manual);
    else manual();
  }
  function selectBackup() { const el = document.getElementById("bk"); if (el) { el.focus(); el.select(); } }

  app.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t || t.tagName === "INPUT") return;
    const act = t.dataset.act;
    if (act !== "reset") resetArmed = false;
    if (act !== "delweek") delArmed = null;
    if (act === "home") home();
    else if (act === "level") levelView(+t.dataset.n);
    else if (act === "card") cardView(t.dataset.id);
    else if (act === "jump") { const d = document.getElementById("did"); d.scrollIntoView({ behavior: "smooth", block: "center" }); d.focus({ preventScroll: true }); }
    else if (act === "did") { store.done[t.dataset.id] = todayISO(); save(); reward(t.dataset.id); }
    else if (act === "logo") {
      clearTimeout(logoTimer); logoTimer = setTimeout(() => { logoTaps = 0; }, 2000);
      if (++logoTaps >= 5) { logoTaps = 0; setTesting(!testing); home(); }
    }
    else if (act === "testoff") { setTesting(false); home(); }
    else if (act === "skipwait") { store.skipWait = !store.skipWait; save(); home(); }
    else if (act === "undo") { delete store.done[t.dataset.id]; save(); cardView(t.dataset.id); }
    else if (act === "checkin") checkin();
    else if (act === "backup") backupView();
    else if (act === "dash") dashboard(t.dataset.wk);
    else if (act === "insight") insightView(+t.dataset.k, t.dataset.wk);
    else if (act === "editweek") checkin(t.dataset.wk);
    else if (act === "delweek") {
      if (delArmed !== t.dataset.wk) { delArmed = t.dataset.wk; dashboard(t.dataset.wk); }
      else { delete store.weeks[t.dataset.wk]; save(); delArmed = null; const ks = weekKeys(); if (ks.length) dashboard(ks[ks.length - 1]); else home(); }
    }
    else if (act === "saveweek" || act === "savecard") {
      const iso = document.getElementById("wk").value;
      const v = [0, 1, 2, 3, 4, 5].map((i) => document.getElementById("n" + i).value.trim());
      if (!iso) return setMsg("Pick the Monday your week started.");
      if (v.slice(1).some((x) => !/^\d+$/.test(x)) || (v[0] && !/^\d+$/.test(v[0]))) return setMsg("Fill in every number below Views. Use 0 if there were none.");
      if (store.weeks[iso] && iso !== editing) return setMsg("You already have numbers for that week. Open it from the dashboard to change them.");
      if (editing && iso !== editing) delete store.weeks[editing];
      store.weeks[iso] = v.map((x, i) => (i === 0 && !x ? null : Number(x)));
      if (act === "savecard") { store.done[t.dataset.id] = todayISO(); save(); reward(t.dataset.id); }
      else { save(); dashboard(iso, true); }
    }
    else if (act === "copy") copyBackup();
    else if (act === "copycard") {
      const c = CARDS.find((x) => x.id === t.dataset.id), el = document.getElementById("cp");
      const manual = () => { el.focus(); el.select(); setMsg("Press and hold the text, tap Select All, then Copy."); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.copy).then(() => setMsg("Copied. Now open your notes app and paste it."), manual);
      else manual();
    }
    else if (act === "restore") {
      const txt = document.getElementById("rs").value, got = parseBackup(txt), ups = parseDone(txt);
      const n = Object.keys(got).length, u = Object.keys(ups).length;
      if (!n && !u) return setMsg("I couldn't find any power-ups or weeks in that text.");
      Object.assign(store.weeks, got); Object.assign(store.done, ups); save();
      backupView("Found " + u + " power-up" + (u === 1 ? "" : "s") + " and " + n + " week" + (n === 1 ? "" : "s") + ". Your progress is back.");
    }
    else if (act === "reset") {
      // Arm in place (no redraw) so the page doesn't jump to the top and hide the message.
      if (!resetArmed) {
        resetArmed = true; t.textContent = "Tap again to erase everything"; t.classList.add("armed");
        setTimeout(() => { if (resetArmed && t.isConnected) { resetArmed = false; t.textContent = "Reset my progress (testing)"; t.classList.remove("armed"); } }, 6000);
      } else { store = { done: {}, ticks: {}, weeks: {} }; save(); resetArmed = false; home(); }
    }
  });
  app.addEventListener("change", (e) => {
    const t = e.target;
    if (!t.matches || !t.matches('input[data-act="tick"]')) return;
    const id = t.dataset.id, i = +t.dataset.i;
    const set = new Set(store.ticks[id] || []);
    if (t.checked) set.add(i); else set.delete(i);
    store.ticks[id] = Array.from(set);
    save();
  });

  home();
</script>
